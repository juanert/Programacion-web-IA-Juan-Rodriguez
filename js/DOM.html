<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      div.content {
        background-color: burlywood;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <p class="content">Hola Mundo</p>
      <button onclick="imprimirMensaje()" id="boton">Presioname</button>
    </div>
    <script>
      /*
        getElementsByTagName(etiqueta) //devuelve un array con todos los elementos de esa etiqueta
        getElementsByClassName(clase) //devuelve un array con todas las etiquetas que tengan esa clase
        getElementById(id) //devuelve el elemento HTML seleccionado
        querySelectorAll(elemento) // me permite seleccionar una etiqueta HTML, .clase o #id

        //Los elementos HTML son su propio tipo de dato llamado NODE (Nodos), son como objetos realmente
      */
      //POE
      document.getElementById("boton").addEventListener("click", () => {
        let contenido = document.getElementsByClassName("content")[0];
        let parrafos = document.querySelectorAll("p");
        if (contenido.style.backgroundColor == "black") {
          contenido.style.backgroundColor = "burlywood";
          parrafos.forEach((parrafo) => {
            parrafo.style.color = "black";
          });
        } else {
          contenido.style.backgroundColor = "black";
          parrafos.forEach((parrafo) => {
            parrafo.style.color = "white";
          });
        }
      });

      function imprimirMensaje() {
        console.log("Hola Mundo");
      }
      /*
        Realiza el piedra papel o tijera de manera visual
      */
      /*
      Propiedades y metodos altamente utilizados en elementos de HTML en Javascript
      Contenido de texto y HTMLtextContent: Obtiene o cambia todo el texto plano que está dentro del elemento.
      innerHTML: Obtiene o cambia el contenido HTML interno, lo que te permite agregar nuevas etiquetas dentro del elemento.
      Estilos y Clases CSSclassList: Administra las clases CSS del elemento de forma sencilla con métodos como .add(), .remove() y .toggle().
      style: Modifica los estilos CSS en línea de ese elemento específico de manera directa (por ejemplo, elemento.style.backgroundColor = 'blue').
      Atributos y Valores value: Obtiene o cambia el valor escrito o seleccionado en elementos de formulario como <input>, <textarea> o <select>.id: Lee o cambia el identificador único (id) del elemento.
      className: Lee o cambia todas las clases del elemento como si fueran un solo 
      texto.setAttribute() / getAttribute(): Sirven para crear, cambiar o leer cualquier atributo personalizado o estándar (como src en una imagen o href en un enlace).
      <p><button>Hola Mundo</button><p>
     */
    </script>
  </body>
</html>
