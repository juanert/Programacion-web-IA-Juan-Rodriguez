<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-blue-600 text-white p-8 flex flex-col items-center gap-8">
    <h1 class="font-bold text-3xl">API de fortnite</h1>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4" id="cosmeticos"></div>
    <script>
      fetch("https://fortnite-api.com/v2/cosmetics", options)
        .then((data) => {
          return data.json();
        })
        .then((cosmeticos) => {
          let divCosmeticos = document.querySelector("#cosmeticos");
          cosmeticos.data.br.forEach((cosmetico) => {
            let divCosmetico = document.createElement("div");
            divCosmetico.classList.add(
              "bg-white",
              "p-4",
              "text-black",
              "flex",
              "flex-col",
              "gap-2",
              "rounded-md",
            );
            divCosmetico.innerHTML = `
              <img src="${cosmetico.images.featured}" />
              <h2>${cosmetico.name}</h2>
            `;
            divCosmeticos.appendChild(divCosmetico);
          });
        });
    </script>
  </body>
</html>
