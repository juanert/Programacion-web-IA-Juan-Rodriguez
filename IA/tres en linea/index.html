  <!-- LÓGICA DEL JUEGO BASADA EN PROGRAMACIÓN ORIENTADA A OBJETOS (POO) -->
  <!-- ================================================================= -->
  <script>
    /**
     * CLASE: SoundManager
     * Responsabilidad: Generar efectos de sonido mediante la Web Audio API nativa.
     */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
      }

      playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          // Audio bloqueado o no soportado en segundo plano
        }
      }

      playMove(symbol) {
        if (symbol === 'X') {
          this.playTone(520, 'sine', 0.1, 0.15);
        } else {
          this.playTone(380, 'triangle', 0.12, 0.15);
        }
      }

      playWin() {
        if (!this.enabled) return;
        const notes = [440, 554, 659, 880]; // A major arpeggio
        notes.forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.2), idx * 100);
        });
      }

      playDraw() {
        if (!this.enabled) return;
        const notes = [400, 350, 300];
        notes.forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 'sawtooth', 0.15, 0.08), idx * 120);
        });
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }
    }

    /**
     * CLASE: Board (Tablero)
     * Responsabilidad: Encapsular el estado de las 9 casillas y la lógica matemática de victoria/empate.
     */
    class Board {
      static WINNING_COMBINATIONS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Filas
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columnas
        [0, 4, 8], [2, 4, 6]             // Diagonales
      ];

      constructor() {
        this.reset();
      }

      reset() {
        this.grid = Array(9).fill(null);
      }

      isAvailable(index) {
        return this.grid[index] === null;
      }

      setMove(index, symbol) {
        if (this.isAvailable(index)) {
          this.grid[index] = symbol;
          return true;
        }
        return false;
      }

      undoMove(index) {
        this.grid[index] = null;
      }

      getAvailableMoves() {
        const moves = [];
        for (let i = 0; i < 9; i++) {
          if (this.grid[i] === null) moves.push(i);
        }
        return moves;
      }

      checkWinner() {
        for (const combination of Board.WINNING_COMBINATIONS) {
          const [a, b, c] = combination;
          if (
            this.grid[a] &&
            this.grid[a] === this.grid[b] &&
            this.grid[a] === this.grid[c]
          ) {
            return {
              winner: this.grid[a],
              line: combination
            };
          }
        }
        return null;
      }

      isFull() {
        return this.grid.every(cell => cell !== null);
      }

      clone() {
        const newBoard = new Board();
        newBoard.grid = [...this.grid];
        return newBoard;
      }
    }

    /**
     * CLASE BASE: Player (Jugador)
     * Principio POO: Herencia y Polimorfismo
     */
    class Player {
      constructor(symbol, name) {
        this.symbol = symbol;
        this.name = name;
        this.score = 0;
        this.isAI = false;
      }

      incrementScore() {
        this.score++;
      }

      resetScore() {
        this.score = 0;
      }
    }

    /**
     * CLASE HIJA: HumanPlayer
     */
    class HumanPlayer extends Player {
      constructor(symbol, name = 'Jugador') {
        super(symbol, name);
        this.isAI = false;
      }
    }

    /**
     * CLASE HIJA: AIPlayer
     * Contiene la IA con Algoritmo Minimax, modos Fácil, Medio e Imbatible.
     */
    class AIPlayer extends Player {
      constructor(symbol = 'O', name = 'IA', difficulty = 'hard') {
        super(symbol, name);
        this.isAI = true;
        this.difficulty = difficulty; // 'easy', 'medium', 'hard'
      }

      setDifficulty(diff) {
        this.difficulty = diff;
      }

      // Calcula el siguiente movimiento según la dificultad
      calculateMove(board, opponentSymbol) {
        const available = board.getAvailableMoves();
        if (available.length === 0) return null;

        // MODO FÁCIL: Movimiento aleatorio
        if (this.difficulty === 'easy') {
          return available[Math.floor(Math.random() * available.length)];
        }

        // MODO MEDIO: Gana o bloquea si hay oportunidad inmediata; de lo contrario aleatorio
        if (this.difficulty === 'medium') {
          // 1. ¿Puedo ganar en este turno?
          for (const move of available) {
            board.setMove(move, this.symbol);
            const win = board.checkWinner();
            board.undoMove(move);
            if (win && win.winner === this.symbol) return move;
          }

          // 2. ¿El oponente va a ganar en el siguiente? Bloquearlo
          for (const move of available) {
            board.setMove(move, opponentSymbol);
            const win = board.checkWinner();
            board.undoMove(move);
            if (win && win.winner === opponentSymbol) return move;
          }

          // 3. Tomar centro si está libre con 50% probabilidad
          if (available.includes(4) && Math.random() > 0.5) {
            return 4;
          }

          // 4. Aleatorio
          return available[Math.floor(Math.random() * available.length)];
        }

        // MODO IMBATIBLE: Algoritmo Minimax completo
        return this.minimaxBestMove(board, opponentSymbol);
      }

      /**
       * ALGORITMO MINIMAX:
       * Explora recursivamente todos los estados futuros del tablero
       * asignando un puntaje exacto para garantizar que la IA nunca pierda.
       */
      minimaxBestMove(board, humanSymbol) {
        let bestScore = -Infinity;
        let bestMove = null;
        const available = board.getAvailableMoves();

        // Optimización inicial: si el centro está disponible en los primeros turnos
        if (available.includes(4) && available.length >= 8) {
          return 4;
        }

        for (const move of available) {
          board.setMove(move, this.symbol);
          const score = this.minimax(board, 0, false, humanSymbol, -Infinity, Infinity);
          board.undoMove(move);

          if (score > bestScore) {
            bestScore = score;
            bestMove = move;
          }
        }

        return bestMove !== null ? bestMove : available[0];
      }

      minimax(board, depth, isMaximizing, humanSymbol, alpha, beta) {
        const winResult = board.checkWinner();

        // Estados terminales
        if (winResult) {
          if (winResult.winner === this.symbol) return 10 - depth; // Gana IA
          if (winResult.winner === humanSymbol) return depth - 10; // Gana Humano
        }

        if (board.isFull()) {
          return 0; // Empate
        }

        const available = board.getAvailableMoves();

        if (isMaximizing) {
          let maxEval = -Infinity;
          for (const move of available) {
            board.setMove(move, this.symbol);
            const evaluation = this.minimax(board, depth + 1, false, humanSymbol, alpha, beta);
            board.undoMove(move);
            maxEval = Math.max(maxEval, evaluation);
            alpha = Math.max(alpha, evaluation);
            if (beta <= alpha) break; // Poda alfa-beta
          }
          return maxEval;
        } else {
          let minEval = Infinity;
          for (const move of available) {
            board.setMove(move, humanSymbol);
            const evaluation = this.minimax(board, depth + 1, true, humanSymbol, alpha, beta);
            board.undoMove(move);
            minEval = Math.min(minEval, evaluation);
            beta = Math.min(beta, evaluation);
            if (beta <= alpha) break; // Poda alfa-beta
          }
          return minEval;
        }
      }
    }

    /**
     * CLASE: TicTacToeGame (Controlador del Juego)
     * Responsabilidad: Coordinar jugadores, turnos, tablero y estados del juego.
     */
    class TicTacToeGame {
      constructor(soundManager) {
        this.sound = soundManager;
        this.board = new Board();
        this.gameMode = 'pve'; // 'pve' (Player vs AI) o 'pvp' (Player vs Player)
        this.drawScore = 0;
        this.isRoundOver = false;
        this.isProcessingAI = false;

        this.initPlayers();
        this.currentTurnSymbol = 'X';
      }

      initPlayers() {
        this.playerX = new HumanPlayer('X', this.gameMode === 'pve' ? 'Tú (X)' : 'Jugador 1 (X)');
        if (this.gameMode === 'pve') {
          this.playerO = new AIPlayer('O', 'IA (O)', 'hard');
        } else {
          this.playerO = new HumanPlayer('O', 'Jugador 2 (O)');
        }
      }

      setMode(mode) {
        if (this.gameMode === mode) return;
        this.gameMode = mode;
        this.resetAllScores();
        this.initPlayers();
        this.startNewRound();
      }

      setAIDifficulty(diff) {
        if (this.playerO instanceof AIPlayer) {
          this.playerO.setDifficulty(diff);
        }
      }

      getCurrentPlayer() {
        return this.currentTurnSymbol === 'X' ? this.playerX : this.playerO;
      }

      getOpponentPlayer() {
        return this.currentTurnSymbol === 'X' ? this.playerO : this.playerX;
      }

      makeMove(index) {
        if (this.isRoundOver) return null;
        if (!this.board.isAvailable(index)) return null;

        const movedSymbol = this.currentTurnSymbol;
        this.board.setMove(index, movedSymbol);
        this.sound.playMove(movedSymbol);

        // Comprobar estado tras el movimiento
        const win = this.board.checkWinner();
        if (win) {
          this.isRoundOver = true;
          const winnerPlayer = this.getCurrentPlayer();
          winnerPlayer.incrementScore();
          this.sound.playWin();
          return { status: 'win', winner: winnerPlayer, symbol: movedSymbol, line: win.line, index };
        }

        if (this.board.isFull()) {
          this.isRoundOver = true;
          this.drawScore++;
          this.sound.playDraw();
          return { status: 'draw', symbol: movedSymbol, index };
        }

        // Alternar turno
        this.currentTurnSymbol = this.currentTurnSymbol === 'X' ? 'O' : 'X';
        return { status: 'next', currentTurn: this.currentTurnSymbol, symbol: movedSymbol, index };
      }

      startNewRound() {
        this.board.reset();
        this.isRoundOver = false;
        this.isProcessingAI = false;
        this.currentTurnSymbol = 'X'; // Comienza X
      }

      resetAllScores() {
        this.playerX.resetScore();
        this.playerO.resetScore();
        this.drawScore = 0;
      }
    }

    /**
     * CLASE: UIController (Interfaz de Usuario)
     * Responsabilidad: Manipulación del DOM, eventos de escucha y renderizado visual.
     */
    class UIController {
      constructor(game, sound) {
        this.game = game;
        this.sound = sound;

        // Elementos DOM
        this.cells = Array.from(document.querySelectorAll('.board-cell'));
        this.scoreXEl = document.getElementById('score-player-x');
        this.scoreOEl = document.getElementById('score-player-o');
        this.scoreDrawsEl = document.getElementById('score-draws');
        this.labelXEl = document.getElementById('label-player-x');
        this.labelOEl = document.getElementById('label-player-o');
        this.turnTextEl = document.getElementById('turn-text');
        this.turnIndicatorDot = document.getElementById('turn-indicator-dot');
        this.cardXEl = document.getElementById('card-player-x');
        this.cardOEl = document.getElementById('card-player-o');

        // Botones de Modo
        this.pveBtn = document.getElementById('mode-pve-btn');
        this.pvpBtn = document.getElementById('mode-pvp-btn');
        this.diffContainer = document.getElementById('ai-difficulty-container');
        this.diffButtons = Array.from(document.querySelectorAll('.diff-btn'));

        // Botones de Control
        this.btnRestartRound = document.getElementById('btn-restart-round');
        this.btnResetAll = document.getElementById('btn-reset-all');
        this.btnToggleSound = document.getElementById('btn-toggle-sound');
        this.soundIconOn = document.getElementById('sound-icon-on');
        this.soundIconOff = document.getElementById('sound-icon-off');

        // Modal
        this.modal = document.getElementById('result-modal');
        this.modalContent = document.getElementById('modal-content');
        this.modalTitle = document.getElementById('modal-title');
        this.modalSubtitle = document.getElementById('modal-subtitle');
        this.modalIcon = document.getElementById('modal-icon');
        this.modalBtnNext = document.getElementById('modal-btn-next');

        this.bindEvents();
        this.updateView();
      }

      bindEvents() {
        // Clics en el tablero
        this.cells.forEach(cell => {
          cell.addEventListener('click', (e) => {
            const index = parseInt(e.currentTarget.dataset.index, 10);
            this.handleCellClick(index);
          });
        });

        // Cambio de Modo
        this.pveBtn.addEventListener('click', () => this.switchMode('pve'));
        this.pvpBtn.addEventListener('click', () => this.switchMode('pvp'));

        // Cambio de Dificultad
        this.diffButtons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            const diff = e.currentTarget.dataset.difficulty;
            this.setDifficulty(diff);
          });
        });

        // Controles de reinicio
        this.btnRestartRound.addEventListener('click', () => {
          this.game.startNewRound();
          this.hideModal();
          this.updateView();
        });

        this.btnResetAll.addEventListener('click', () => {
          this.game.resetAllScores();
          this.game.startNewRound();
          this.hideModal();
          this.updateView();
        });

        this.modalBtnNext.addEventListener('click', () => {
          this.game.startNewRound();
          this.hideModal();
          this.updateView();
        });

        // Control de Sonido
        this.btnToggleSound.addEventListener('click', () => {
          const isSoundOn = this.sound.toggle();
          this.soundIconOn.classList.toggle('hidden', !isSoundOn);
          this.soundIconOff.classList.toggle('hidden', isSoundOn);
        });
      }

      handleCellClick(index) {
        if (this.game.isRoundOver || this.game.isProcessingAI) return;
        if (this.game.gameMode === 'pve' && this.game.getCurrentPlayer().isAI) return;

        const result = this.game.makeMove(index);
        if (!result) return;

        this.renderMove(index, result.symbol);
        this.processGameResult(result);

        // Si es turno de la IA y el juego continúa
        if (
          !this.game.isRoundOver &&
          this.game.gameMode === 'pve' &&
          this.game.getCurrentPlayer().isAI
        ) {
          this.triggerAIMove();
        }
      }

      triggerAIMove() {
        this.game.isProcessingAI = true;
        this.turnTextEl.innerHTML = `Pensando jugada... <span class="animate-pulse">🤖</span>`;

        // Pequeño retardo para dar sensación humana/IA
        setTimeout(() => {
          if (this.game.isRoundOver || this.game.currentTurnSymbol !== 'O') {
            this.game.isProcessingAI = false;
            return;
          }

          const aiPlayer = this.game.playerO;
          const bestIndex = aiPlayer.calculateMove(this.game.board, 'X');

          this.game.isProcessingAI = false;

          if (bestIndex !== null) {
            const result = this.game.makeMove(bestIndex);
            if (result) {
              this.renderMove(bestIndex, result.symbol);
              this.processGameResult(result);
            }
          }
        }, 400);
      }

      processGameResult(result) {
        if (result.status === 'win') {
          this.highlightWinningLine(result.line);
          this.updateScores();
          this.showModalWin(result.winner);
        } else if (result.status === 'draw') {
          this.updateScores();
          this.showModalDraw();
        } else {
          this.updateTurnDisplay();
        }
      }

      renderMove(index, symbol) {
        const cell = this.cells[index];
        cell.disabled = true;

        if (symbol === 'X') {
          cell.innerHTML = `
            <svg class="w-12 h-12 sm:w-16 sm:h-16 cell-symbol-x transform transition-transform duration-200 scale-90 hover:scale-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          `;
        } else {
          cell.innerHTML = `
            <svg class="w-12 h-12 sm:w-16 sm:h-16 cell-symbol-o transform transition-transform duration-200 scale-90 hover:scale-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
            </svg>
          `;
        }
      }

      highlightWinningLine(line) {
        line.forEach(idx => {
          this.cells[idx].classList.add('winning-cell');
        });
      }

      updateScores() {
        this.scoreXEl.textContent = this.game.playerX.score;
        this.scoreOEl.textContent = this.game.playerO.score;
        this.scoreDrawsEl.textContent = this.game.drawScore;
      }

      updateTurnDisplay() {
        const isX = this.game.currentTurnSymbol === 'X';
        const currentPlayer = this.game.getCurrentPlayer();

        this.turnTextEl.innerHTML = `Turno de: <span class="${isX ? 'text-cyan-400' : 'text-pink-400'} font-bold">${currentPlayer.name}</span>`;

        if (isX) {
          this.turnIndicatorDot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse';
          this.cardXEl.classList.add('border-cyan-500/80', 'bg-cyan-950/20');
          this.cardOEl.classList.remove('border-pink-500/80', 'bg-pink-950/20');
          this.cardOEl.classList.add('border-slate-800');
        } else {
          this.turnIndicatorDot.className = 'w-2.5 h-2.5 rounded-full bg-pink-400 animate-pulse';
          this.cardOEl.classList.add('border-pink-500/80', 'bg-pink-950/20');
          this.cardOEl.classList.remove('border-slate-800');
          this.cardXEl.classList.remove('border-cyan-500/80', 'bg-cyan-950/20');
          this.cardXEl.classList.add('border-slate-800');
        }
      }

      updateView() {
        // Limpiar casillas
        this.cells.forEach(cell => {
          cell.innerHTML = '';
          cell.disabled = false;
          cell.className = 'board-cell bg-slate-950/70 border border-slate-800/80 rounded-2xl flex items-center justify-center font-heading text-4xl sm:text-5xl font-extrabold focus:outline-none';
        });

        // Actualizar etiquetas
        if (this.game.gameMode === 'pve') {
          this.labelXEl.textContent = 'Tú (X)';
          this.labelOEl.textContent = 'IA (O)';
        } else {
          this.labelXEl.textContent = 'Jugador 1 (X)';
          this.labelOEl.textContent = 'Jugador 2 (O)';
        }

        this.updateScores();
        this.updateTurnDisplay();
      }

      switchMode(mode) {
        if (mode === 'pve') {
          this.pveBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-md';
          this.pvpBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-400 hover:text-white';
          this.diffContainer.classList.remove('opacity-40', 'pointer-events-none');
        } else {
          this.pvpBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-md';
          this.pveBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-400 hover:text-white';
          this.diffContainer.classList.add('opacity-40', 'pointer-events-none');
        }

        this.game.setMode(mode);
        this.updateView();
      }

      setDifficulty(diff) {
        this.diffButtons.forEach(btn => {
          if (btn.dataset.difficulty === diff) {
            btn.className = 'diff-btn py-1.5 px-1.5 text-center rounded-lg text-xs font-semibold text-white bg-pink-600 shadow-md transition';
          } else {
            btn.className = 'diff-btn py-1.5 px-1.5 text-center rounded-lg text-xs font-medium text-slate-400 hover:text-white transition';
          }
        });

        this.game.setAIDifficulty(diff);
      }

      showModalWin(winner) {
        setTimeout(() => {
          const isX = winner.symbol === 'X';
          this.modalIcon.textContent = isX ? '🏆' : (this.game.gameMode === 'pve' ? '🤖' : '🎉');
          this.modalTitle.textContent = `¡Victoria para ${winner.name}!`;
          this.modalSubtitle.textContent = `Gran partida. El jugador ${winner.symbol} dominó el tablero.`;
          this.showModal();
        }, 500);
      }

      showModalDraw() {
        setTimeout(() => {
          this.modalIcon.textContent = '🤝';
          this.modalTitle.textContent = '¡Empate!';
          this.modalSubtitle.textContent = 'Ningún jugador logró alinear tres fichas. ¡Estuvo reñido!';
          this.showModal();
        }, 500);
      }

      showModal() {
        this.modal.classList.remove('hidden');
        setTimeout(() => {
          this.modal.classList.remove('opacity-0');
          this.modalContent.classList.remove('scale-95');
          this.modalContent.classList.add('scale-100');
        }, 10);
      }

      hideModal() {
        this.modalContent.classList.remove('scale-100');
        this.modalContent.classList.add('scale-95');
        this.modal.classList.add('opacity-0');
        setTimeout(() => {
          this.modal.classList.add('hidden');
        }, 200);
      }
    }

    // =================================================================
    // INICIALIZACIÓN DE LA APLICACIÓN
    // =================================================================
    document.addEventListener('DOMContentLoaded', () => {
      const soundManager = new SoundManager();
      const game = new TicTacToeGame(soundManager);
      const ui = new UIController(game, soundManager);
    });
  </script>
</body>
